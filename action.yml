name: Run Tests and Check Code Coverage
description: Runs tests and checks if the code coverage meets the required threshold.
inputs:
  required-code-coverage:
    description: Code coverage input parameter
    default: '85'
    required: true
  target-org:
    description: Target Salesforce org for deployment
    required: true
outputs:
  code-coverage:
    description: The code coverage percentage
    value: ${{ steps.run-tests.outputs.code-coverage }}
  is-code-covered:
    description: Whether the code coverage meets the required threshold
    value: ${{ steps.run-tests.outputs.is-code-covered }}
  is-test-success:
    description: Whether the tests were successful
    value: ${{ steps.run-tests.outputs.is-test-success }}
runs:
  using: "composite"
  steps:
    - name: Run Tests
      id: run-tests
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/run-tests.sh"

        jq -r '
          "code-coverage=\(.code_coverage)",
          "is-code-covered=\(.is_code_covered)",
          "is-test-success=\(.is_test_success)"
        ' test-run/results.json >> "$GITHUB_OUTPUT"

        cat test-run/step-summary.md >> "$GITHUB_STEP_SUMMARY"
      shell: bash
      env:
        REQUIRED_CODE_COVERAGE: ${{ inputs.required-code-coverage }}
        TARGET_ORG: ${{ inputs.target-org }}

